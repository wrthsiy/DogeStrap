name: CI (Release)
on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: DogeStrap (Release) (${{ github.sha }})
        path: .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\*

    - name: Rename binary
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: mv Bloxstrap/bin/Release/net6.0-windows/win-x64/publish/DogeStrap.exe DogeStrap-${{ github.ref_name }}.exe

    - name: Create release (draft)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: DogeStrap-${{ github.ref_name }}.exe
        name: DogeStrap ${{ github.ref_name }}
